name: Pooltophone 0.22.0 unsigned release for permanent-key signing
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile Android release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Publish unsigned build input for local signing
        uses: actions/upload-artifact@v4
        with:
          name: Pooltophone-0.22.0-UNSIGNED-not-installable
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2
