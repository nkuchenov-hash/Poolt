name: Pooltophone signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poolto-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POOLTOPHONE_SIGNING_BUNDLE: ${{ secrets.POOLTOPHONE_SIGNING_BUNDLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load permanent signing key (never commit it)
        run: python3 scripts/prepare-signing.py

      - name: Build permanently signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify Android signature and pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=82c5c07a90e0b1589773f914fbce47332fd2c5d81bcce8448957bc8e144d5b03
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Certificate mismatch: refusing to publish APK." >&2
            exit 1
          fi
          cp "$APK" app/build/outputs/apk/release/Pooltophone-signed.apk
          echo "APK signature verified against permanent certificate."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pooltophone-SIGNED-${{ github.run_number }}
          path: app/build/outputs/apk/release/Pooltophone-signed.apk
          if-no-files-found: error
          retention-days: 90

      - name: Delete temporary key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pooltophone-private-signing.p12"
