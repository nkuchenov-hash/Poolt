name: Pooltophone 0.21.0 unsigned APK for permanent local signing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload unsigned APK for signing with permanent certificate
        uses: actions/upload-artifact@v4
        with:
          name: Pooltophone-0.21.0-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2
