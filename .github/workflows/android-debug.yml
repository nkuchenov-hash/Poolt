name: Internal Android debug build (not for installation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile internal debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload internal test APK (not an upgrade)
        uses: actions/upload-artifact@v4
        with:
          name: Poolt-INTERNAL-debug-not-for-install
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
