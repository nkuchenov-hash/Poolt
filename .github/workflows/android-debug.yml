name: Android internal debug and signing bootstrap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Poolt-INTERNAL-debug-not-for-install
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Stage unsigned release and Android signer for local one-time bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-bootstrap
          cp app/build/outputs/apk/release/app-release-unsigned.apk signing-bootstrap/app-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-bootstrap/apksigner.jar

      - name: Upload temporary unsigned input (NOT installable)
        uses: actions/upload-artifact@v4
        with:
          name: Poolt-BOOTSTRAP-UNSIGNED-not-installable
          path: signing-bootstrap/
          if-no-files-found: error
          retention-days: 7
