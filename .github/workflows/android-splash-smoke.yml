name: Android Splash Screenshot Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Capture startup and remote screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop app.poolt
            adb shell am start -W -n app.poolt/.MainActivity
            sleep 0.5
            adb shell screencap -p /sdcard/poolt-splash-early.png
            adb pull /sdcard/poolt-splash-early.png pool-splash-early.png
            sleep 0.6
            adb shell screencap -p /sdcard/poolt-splash-late.png
            adb pull /sdcard/poolt-splash-late.png pool-splash-late.png
            sleep 2
            adb shell screencap -p /sdcard/poolt-home.png
            adb pull /sdcard/poolt-home.png pool-home.png

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Poolt-screenshots
          path: pool-*.png
          if-no-files-found: warn
